<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/776/776531.png" type="image/png">
    <title>Universal Packer - Pro Blueprints</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

<div id="app" class="w-full max-w-[1600px] mx-auto p-4 md:p-6 lg:p-10">
    <!-- Header Dashboard -->
    <header id="mainHeader" class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
        <div>
            <h1 class="text-4xl font-black text-slate-900 dark:text-white tracking-tight flex items-center gap-3">
                <span class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg">
                    <i data-lucide="briefcase"></i>
                </span>
                Universal Packer
            </h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Struktur für deine Reisen.</p>
        </div>
        <div class="flex gap-3 items-center">
            <button onclick="toggleDarkMode()"
                    class="p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition">
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-amber-400"></i>
                <i data-lucide="moon" class="w-5 h-5 block dark:hidden text-slate-600"></i>
            </button>
            <button onclick="openPresetManager()"
                    class="p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition"
                    title="Blueprints verwalten">
                <i data-lucide="layers" class="w-5 h-5"></i>
            </button>
            <button onclick="importJSON()"
                    class="p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition"
                    title="Import">
                <i data-lucide="upload" class="w-5 h-5"></i>
            </button>
            <input type="file" id="importInput" class="hidden" accept=".json" onchange="handleFileSelect(event)">
            <button onclick="openTemplateModal()"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-indigo-200 dark:shadow-indigo-900/20 shadow-xl hover:bg-indigo-700 transition flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Neue Reise
            </button>
        </div>
    </header>

    <!-- Views -->
    <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="editor" class="hidden animate-in fade-in duration-500">
        <div class="flex justify-between items-center mb-6">
            <button onclick="showDashboard()"
                    class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 transition font-medium">
                <i data-lucide="chevron-left" class="w-5 h-5"></i> Dashboard
            </button>
            <button onclick="toggleDarkMode()"
                    class="p-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm transition">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden text-slate-600"></i>
            </button>
        </div>

        <!-- Erhöhter z-Index auf 50 damit das Dropdown nicht verdeckt wird -->
        <div id="listDetailHeader"
             class="bg-white dark:bg-slate-900 p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-800 mb-8 glass relative z-50"></div>

        <!-- Action Bar Top -->
        <div class="mb-8 flex flex-wrap gap-4 bg-white/50 dark:bg-slate-900/50 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 backdrop-blur-sm relative z-10">
            <button onclick="addNewCategory()"
                    class="flex-grow px-8 py-4 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-slate-400 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 font-bold bg-white dark:bg-slate-900">
                <i data-lucide="plus" class="w-6 h-6"></i> Leere Kategorie
            </button>
            <button onclick="openAddPresetToTripModal()"
                    class="flex-grow px-8 py-4 bg-indigo-50 dark:bg-indigo-900/20 border-2 border-indigo-200 dark:border-indigo-800 rounded-2xl text-indigo-600 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-all flex items-center justify-center gap-2 font-bold">
                <i data-lucide="layers" class="w-6 h-6"></i> Blueprint einfügen
            </button>
        </div>

        <!-- Waterfall Container -->
        <div id="categoryContainer" class="columns-1 lg:columns-2 gap-6 items-start"></div>

        <div class="mt-12 mb-20 flex flex-wrap gap-4 bg-white/50 dark:bg-slate-900/50 p-4 rounded-3xl border border-slate-200 dark:border-slate-800 backdrop-blur-sm">
            <button onclick="addNewCategory()"
                    class="flex-grow px-8 py-4 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl text-slate-400 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 font-bold bg-white dark:bg-slate-900">
                <i data-lucide="plus" class="w-6 h-6"></i> Leere Kategorie
            </button>
            <button onclick="openAddPresetToTripModal()"
                    class="flex-grow px-8 py-4 bg-indigo-50 dark:bg-indigo-900/20 border-2 border-indigo-200 dark:border-indigo-800 rounded-2xl text-indigo-600 hover:bg-indigo-100 dark:hover:bg-indigo-900/40 transition-all flex items-center justify-center gap-2 font-bold">
                <i data-lucide="layers" class="w-6 h-6"></i> Blueprint einfügen
            </button>
        </div>

    </div>
</div>

<!-- Modals -->
<div id="templateModal"
     class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 w-full max-w-2xl shadow-2xl border border-white/10">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold dark:text-white">Trip-Vorlage wählen</h3>
            <button onclick="closeModal('templateModal')"
                    class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition"><i
                    data-lucide="x"></i></button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <button onclick="createNewList('city')"
                    class="p-6 border-2 border-slate-100 dark:border-slate-800 rounded-2xl hover:border-indigo-500 text-left transition group">
                <i data-lucide="building-2" class="w-10 h-10 text-indigo-600 mb-3"></i>
                <h4 class="font-bold text-lg dark:text-white">Städtetrip</h4>
                <p class="text-sm text-slate-400">Berlin, Paris, London.</p>
            </button>
            <button onclick="createNewList('outdoor')"
                    class="p-6 border-2 border-slate-100 dark:border-slate-800 rounded-2xl hover:border-green-500 text-left transition group">
                <i data-lucide="mountain" class="w-10 h-10 text-green-600 mb-3"></i>
                <h4 class="font-bold text-lg dark:text-white">Outdoor</h4>
                <p class="text-sm text-slate-400">Wandern & Natur.</p>
            </button>
            <button onclick="createNewList('photography')"
                    class="p-6 border-2 border-slate-100 dark:border-slate-800 rounded-2xl hover:border-amber-500 text-left transition group">
                <i data-lucide="camera" class="w-10 h-10 text-amber-600 mb-3"></i>
                <h4 class="font-bold text-lg dark:text-white">Foto-Expedition</h4>
                <p class="text-sm text-slate-400">Gear & Kameras.</p>
            </button>
            <button onclick="createNewList('empty')"
                    class="p-6 border-2 border-slate-100 dark:border-slate-800 rounded-2xl hover:border-slate-500 text-left transition group">
                <i data-lucide="file" class="w-10 h-10 text-slate-600 mb-3"></i>
                <h4 class="font-bold text-lg dark:text-white">Leer</h4>
                <p class="text-sm text-slate-400">Von vorn starten.</p>
            </button>
        </div>
    </div>
</div>

<!-- Blueprint Manager Modal -->
<div id="presetManagerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 w-full max-w-4xl shadow-2xl border border-white/10 max-h-[85vh] flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold dark:text-white flex items-center gap-2"><i data-lucide="layers" class="text-indigo-500"></i> Blueprints verwalten</h3>
            <button onclick="closeModal('presetManagerModal')" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition"><i data-lucide="x"></i></button>
        </div>
        <div id="presetListContainer" class="flex-grow overflow-y-auto pr-2 custom-scrollbar space-y-4 mb-6"></div>
        <div class="flex justify-center">
            <button onclick="createNewPreset()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition flex items-center gap-2">
                <i data-lucide="plus"></i> Neuer Blueprint
            </button>
        </div>
    </div>
</div>

<!-- Modal: Blueprint manuell bearbeiten -->
<div id="editPresetModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[110] p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 w-full max-w-2xl shadow-2xl border border-white/10 max-h-[80vh] flex flex-col">
        <div id="editPresetHeader" class="mb-6"></div>
        <div id="editPresetItems" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 mb-6 pr-2"></div>
        <div class="flex justify-between items-center">
            <button onclick="addItemToPreset()" class="px-6 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl font-bold hover:bg-indigo-50 dark:hover:bg-indigo-900/40 transition flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Item hinzufügen
            </button>
            <button onclick="closeModal('editPresetModal')" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">Speichern & Schließen</button>
        </div>
    </div>
</div>

<!-- Add Preset to Trip Modal -->
<div id="addPresetModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 w-full max-w-md shadow-2xl border border-white/10">
        <h3 class="text-xl font-bold mb-6 dark:text-white">Blueprint einfügen</h3>
        <div id="addPresetGrid" class="grid grid-cols-1 gap-3 max-h-80 overflow-y-auto pr-2 custom-scrollbar"></div>
        <div class="mt-6 flex justify-end">
            <button onclick="closeModal('addPresetModal')" class="text-slate-400 font-bold px-4 py-2">Abbrechen</button>
        </div>
    </div>
</div>

<!-- Emoji Picker Modal -->
<div id="emojiPickerModal"
     class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[120] p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 w-full max-w-md shadow-2xl">
        <h3 class="text-xl font-bold mb-6 dark:text-white">Emoji wählen</h3>
        <div id="emojiGrid"
             class="grid grid-cols-5 gap-3 mb-8 max-h-60 overflow-y-auto pr-2 custom-scrollbar text-2xl text-center"></div>
        <div class="flex justify-end">
            <button onclick="closeModal('emojiPickerModal')"
                    class="px-6 py-2 bg-slate-100 dark:bg-slate-800 dark:text-slate-300 rounded-xl font-bold transition hover:bg-slate-200 dark:hover:bg-slate-700">
                Abbrechen
            </button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
